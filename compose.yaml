services:
  merchantiq:
    build:
      context: .
      dockerfile: Dockerfile
    image: merchantiq:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
